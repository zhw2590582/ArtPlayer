name: Deploy Docs

on:
  push:
    branches:
      - master

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    # Only the upstream repository publishes the documentation site; forks
    # run the build without touching Pages.
    if: github.repository == 'zhw2590582/ArtPlayer'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - run: npm run build:all
      - name: setup pages
        uses: actions/configure-pages@v5
      - name: upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs
      - name: deploy
        id: deployment
        uses: actions/deploy-pages@v5
